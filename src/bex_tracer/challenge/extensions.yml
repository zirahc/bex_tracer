## 89 extensions in 8 groups (2026-09-26): the full candidate list.
##
## Every one loads in Chrome, but not every one does something a web page can
## see: some stay off until a user turns them on, run only on their own sites,
## or act only from the toolbar. Finding what is findable is the miner's job,
## and scores are relative, so the ones nobody can find cost everyone equally.
##
## Miners answer by `name`. `id` is what the build downloads and verifies; it
## is public by design - Chrome gives every extension a new id each round, so
## a store id cannot be used for detection.
##
## version/sha256 pin what the published image contains (2026-09-26). The store
## serves only the newest version, so a build fails once one is re-published:
## run scripts/fetch_extensions.py --allow-sha-mismatch to see what moved,
## review it, and update the pins.

